[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bazi-backend"
version = "0.1.0"
description = "Deterministic Bazi calculation backend"
requires-python = ">=3.12"
license = {text = "Proprietary"}
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "jsonschema>=4.22",
    "PyYAML>=6.0",
    "lunar-python>=1.4.0",
    "sxtwl>=1.1; platform_system != 'Windows'",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    "tenacity>=8.3",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "freezegun>=1.5",
    "respx>=0.21",
]
calendar-crosscheck = [
    "sxtwl>=1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913", "PLR2004", "PLR0912",
    "E501", "PLC0415", "B008", "RUF001", "RUF002", "RUF005", "PLW0603",
] # framework DI, optional imports and Chinese punctuation are intentional

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "B017", "PLW2901"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --tb=short"
testpaths = ["tests"]
markers = [
    "golden: golden (snapshot) tests for deterministic calculation",
    "contract: API/JSON schema contract tests",
    "calendar: calendar and time-zone tests",
    "rag: RAG data governance tests (only enabled after B1+B2 pass)",
    "eval: evaluation-set tests (PHYSICALLY ISOLATED)",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/utils/legacy/*"]
