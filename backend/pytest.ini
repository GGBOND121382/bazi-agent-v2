[pytest]
minversion = 8.0
addopts = -ra --strict-markers --tb=short -p no:cacheprovider
testpaths = tests
pythonpath = . ..
markers =
    calendar: dual-engine calendar tests
    contract: JSON Schema + Pydantic contract tests
    golden: golden snapshot tests (deterministic chart outputs)
    rag: RAG data governance tests (only after B1+B2 pass)
    eval: evaluation-set tests (PHYSICALLY ISOLATED — never auto-run)
asyncio_mode = auto
