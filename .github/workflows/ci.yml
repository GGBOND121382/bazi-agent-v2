name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/mobile-ui-deterministic-chat]

jobs:
  powershell_scripts:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Parse launch scripts with Windows PowerShell 5.1
        id: parse_scripts
        shell: powershell
        run: |
          $failed = $false
          $report = New-Object System.Collections.Generic.List[string]
          foreach ($path in @('start.ps1', 'stop.ps1', 'status.ps1')) {
            $resolvedPath = (Resolve-Path $path).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($resolvedPath, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $report.Add("Syntax errors in $path")
              foreach ($parseError in $errors) {
                $report.Add(("line {0}, column {1}: {2}" -f $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message))
              }
            } else {
              $report.Add("OK: $path")
            }
          }
          $report | Set-Content -Path powershell-parser-report.txt -Encoding UTF8
          $report | ForEach-Object { Write-Host $_ }
          if ($failed) { exit 1 }
      - name: Upload PowerShell parser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parser-report
          path: powershell-parser-report.txt
          if-no-files-found: error
          retention-days: 3

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests
      - name: Pytest
        id: backend_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          tail -n 120 pytest.log
          exit $status
      - name: Mypy
        id: backend_mypy
        if: always()
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m mypy app > mypy.log 2>&1
          status=$?
          tail -n 120 mypy.log
          exit $status
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/pytest.log
            backend/mypy.log
          if-no-files-found: warn
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        id: frontend_tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          tail -n 120 vitest.log
          exit $status
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend/vitest.log
          if-no-files-found: error
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload E2E screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 3
