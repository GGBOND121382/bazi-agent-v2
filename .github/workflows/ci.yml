name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/mobile-ui-deterministic-chat]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests
      - name: Pytest
        id: backend_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          tail -n 120 pytest.log
          exit $status
      - name: Mypy
        id: backend_mypy
        if: always()
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m mypy app > mypy.log 2>&1
          status=$?
          tail -n 120 mypy.log
          exit $status
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/pytest.log
            backend/mypy.log
          if-no-files-found: warn
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        id: frontend_tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          tail -n 120 vitest.log
          exit $status
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend/vitest.log
          if-no-files-found: error
          retention-days: 3
