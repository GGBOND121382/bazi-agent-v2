name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/mobile-ui-deterministic-chat]

jobs:
  powershell_scripts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend for Windows smoke test
        run: python -m pip install -e './backend[dev]'
      - name: Install frontend for Windows smoke test
        working-directory: frontend
        run: npm ci
      - name: Parse launch scripts with Windows PowerShell 5.1
        id: parse_scripts
        shell: powershell
        run: |
          $failed = $false
          $report = New-Object System.Collections.Generic.List[string]
          foreach ($path in @('start.ps1', 'stop.ps1', 'status.ps1')) {
            $resolvedPath = (Resolve-Path $path).Path
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($resolvedPath, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $report.Add("Syntax errors in $path")
              foreach ($parseError in $errors) {
                $report.Add(("line {0}, column {1}: {2}" -f $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message))
              }
            } else {
              $report.Add("OK: $path")
            }
          }
          $report | Set-Content -Path powershell-parser-report.txt -Encoding UTF8
          $report | ForEach-Object { Write-Host $_ }
          if ($failed) { exit 1 }
      - name: Verify detached stdin behavior
        shell: powershell
        run: |
          $startScript = Get-Content -LiteralPath start.ps1 -Raw
          $redirectCount = ([regex]::Matches($startScript, '-RedirectStandardInput\s+\$NullInputFile')).Count
          if ($redirectCount -lt 3) {
            throw "start.ps1 must redirect stdin for worker, backend, and frontend; found $redirectCount occurrences."
          }

          $testDir = Join-Path $env:RUNNER_TEMP 'bazi-detached-stdin-test'
          New-Item -ItemType Directory -Path $testDir -Force | Out-Null
          $childScript = Join-Path $testDir 'read-stdin.ps1'
          $inputFile = Join-Path $testDir 'stdin.txt'
          $outputFile = Join-Path $testDir 'stdout.txt'
          $errorFile = Join-Path $testDir 'stderr.txt'
          $resultFile = Join-Path $testDir 'result.txt'

          @'
          param([string]$ResultPath)
          $line = [Console]::In.ReadLine()
          if ($null -eq $line) {
              'EOF' | Set-Content -LiteralPath $ResultPath -Encoding Ascii
          } else {
              "INPUT:$line" | Set-Content -LiteralPath $ResultPath -Encoding Ascii
          }
          '@ | Set-Content -LiteralPath $childScript -Encoding Ascii
          Set-Content -LiteralPath $inputFile -Value '' -Encoding Ascii -NoNewline

          $arguments = @(
            '-NoProfile',
            '-NonInteractive',
            '-File', ('"{0}"' -f $childScript),
            '-ResultPath', ('"{0}"' -f $resultFile)
          )
          $process = Start-Process powershell.exe `
            -ArgumentList $arguments `
            -RedirectStandardInput $inputFile `
            -RedirectStandardOutput $outputFile `
            -RedirectStandardError $errorFile `
            -WindowStyle Hidden `
            -PassThru

          if (-not $process.WaitForExit(5000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw 'A detached child blocked waiting for the caller console input.'
          }
          $result = (Get-Content -LiteralPath $resultFile -Raw).Trim()
          if ($result -ne 'EOF') {
            throw "Detached stdin test returned unexpected result: $result"
          }
      - name: Start, probe, and stop the real app in mock mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backendPort = 18000
          $frontendPort = 15173

          .\stop.ps1 -Force -BackendPort $backendPort -FrontendPort $frontendPort | Out-Host
          .\start.ps1 -Mock -SkipInstall -BackendPort $backendPort -FrontendPort $frontendPort
          Write-Host 'TERMINAL_PROBE_OK'

          $deadline = (Get-Date).AddSeconds(90)
          $backendReady = $false
          $frontendReady = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $backend = Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/api/v1/health" -UseBasicParsing -TimeoutSec 2
              $backendReady = ($backend.StatusCode -eq 200)
            } catch {
              $backendReady = $false
            }
            try {
              $frontend = Invoke-WebRequest -Uri "http://127.0.0.1:$frontendPort/" -UseBasicParsing -TimeoutSec 2
              $frontendReady = ($frontend.StatusCode -eq 200)
            } catch {
              $frontendReady = $false
            }
            if ($backendReady -and $frontendReady) { break }
            Start-Sleep -Milliseconds 500
          }

          .\status.ps1 -BackendPort $backendPort -FrontendPort $frontendPort | Out-Host
          if (-not ($backendReady -and $frontendReady)) {
            Write-Host '--- startup.out.log ---'
            Get-Content .\.runtime\startup.out.log -Tail 200 -ErrorAction SilentlyContinue | Out-Host
            Write-Host '--- startup.err.log ---'
            Get-Content .\.runtime\startup.err.log -Tail 200 -ErrorAction SilentlyContinue | Out-Host
            Write-Host '--- backend.err.log ---'
            Get-Content .\.runtime\backend.err.log -Tail 200 -ErrorAction SilentlyContinue | Out-Host
            Write-Host '--- frontend.err.log ---'
            Get-Content .\.runtime\frontend.err.log -Tail 200 -ErrorAction SilentlyContinue | Out-Host
            throw 'The real Windows background startup smoke test did not reach healthy backend and frontend services.'
          }

          .\stop.ps1 -Force -BackendPort $backendPort -FrontendPort $frontendPort | Out-Host
          Start-Sleep -Seconds 1
          $backendListeners = @(Get-NetTCPConnection -LocalPort $backendPort -State Listen -ErrorAction SilentlyContinue)
          $frontendListeners = @(Get-NetTCPConnection -LocalPort $frontendPort -State Listen -ErrorAction SilentlyContinue)
          if (($backendListeners.Count -gt 0) -or ($frontendListeners.Count -gt 0)) {
            throw 'stop.ps1 left a test port listening.'
          }
      - name: Cleanup Windows smoke processes
        if: always()
        shell: powershell
        run: .\stop.ps1 -Force -BackendPort 18000 -FrontendPort 15173
      - name: Upload PowerShell diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powershell-parser-report
          path: |
            powershell-parser-report.txt
            .runtime/*.log
          if-no-files-found: warn
          retention-days: 3

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests
      - name: Pytest
        id: backend_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          tail -n 120 pytest.log
          exit $status
      - name: Mypy
        id: backend_mypy
        if: always()
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m mypy app > mypy.log 2>&1
          status=$?
          tail -n 120 mypy.log
          exit $status
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/pytest.log
            backend/mypy.log
          if-no-files-found: warn
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        id: frontend_tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          tail -n 120 vitest.log
          exit $status
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend/vitest.log
          if-no-files-found: error
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload E2E screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 3
