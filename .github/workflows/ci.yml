name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/mobile-ui-deterministic-chat]

permissions:
  contents: write

jobs:
  apply_overlay:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified source overlay when staged
        shell: bash
        run: |
          set -euo pipefail
          if ! compgen -G '.delivery/part*' > /dev/null; then
            echo 'No staged overlay; nothing to apply.'
            exit 0
          fi
          cat .delivery/part* | base64 -d > /tmp/bazi-overlay.tgz
          tar -xzf /tmp/bazi-overlay.tgz
          rm -rf .delivery .github/workflows/apply-local-overlay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: finish precise fortune engine and durable app"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  source_snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Package source snapshot
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.venv \
            --exclude='**/__pycache__' \
            -czf /tmp/bazi-agent-v2-source.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: bazi-agent-v2-source
          path: /tmp/bazi-agent-v2-source.tgz
          if-no-files-found: error
          retention-days: 1

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests
      - name: Pytest
        id: backend_tests
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m pytest -q > pytest.log 2>&1
          status=$?
          tail -n 120 pytest.log
          exit $status
      - name: Mypy
        id: backend_mypy
        if: always()
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m mypy app > mypy.log 2>&1
          status=$?
          tail -n 120 mypy.log
          exit $status
      - name: Upload backend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-diagnostics
          path: |
            backend/pytest.log
            backend/mypy.log
          if-no-files-found: warn
          retention-days: 3

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        id: frontend_tests
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test > vitest.log 2>&1
          status=$?
          tail -n 120 vitest.log
          exit $status
      - name: Upload frontend diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-diagnostics
          path: frontend/vitest.log
          if-no-files-found: error
          retention-days: 3

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Desktop and mobile E2E
        working-directory: frontend
        run: npm run e2e
      - name: Upload E2E screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            frontend/test-results
            frontend/playwright-report
          if-no-files-found: warn
          retention-days: 3
