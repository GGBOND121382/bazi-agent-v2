name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, agent/mobile-ui-deterministic-chat]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests
      - name: Pytest
        working-directory: backend
        run: set -o pipefail; python -m pytest -q 2>&1 | tail -n 100
      - name: Mypy
        working-directory: backend
        run: set -o pipefail; python -m mypy app 2>&1 | tail -n 100

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Unit tests
        working-directory: frontend
        run: set -o pipefail; npm test 2>&1 | tail -n 100
