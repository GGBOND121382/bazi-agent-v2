name: Windows startup smoke

on:
  push:
    branches: [agent/mobile-ui-deterministic-chat]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply_temporal_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ui-deterministic-chat
          fetch-depth: 0
      - name: Apply audited temporal and shensha patch
        shell: bash
        run: |
          set -euxo pipefail
          exec > >(tee /tmp/apply.log) 2>&1
          git merge --no-edit origin/main
          cat .github/temporal_patch/chunk_* | base64 -d > /tmp/temporal.patch.gz
          gzip -t /tmp/temporal.patch.gz
          gzip -dc /tmp/temporal.patch.gz > /tmp/temporal.patch
          git apply --3way /tmp/temporal.patch
          git show ae4781963fd0fc04f022d2791525a049b9a06320:.github/workflows/windows-startup-smoke.yml > .github/workflows/windows-startup-smoke.yml
          rm -rf .github/temporal_patch
          rm -f .github/workflows/source-snapshot-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: correct exact temporal and shensha calculations"
          git push origin HEAD:agent/mobile-ui-deterministic-chat
      - name: Upload apply diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-apply-diagnostics
          path: |
            /tmp/apply.log
            /tmp/temporal.patch
          if-no-files-found: warn
          retention-days: 1

  smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          foreach ($path in @('start.ps1', 'stop.ps1', 'status.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
              throw "PowerShell parse failed: $path"
            }
          }
      - name: Start, probe and stop
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $backendPort = 18000
          $frontendPort = 15173

          .\stop.ps1 -Force -BackendPort $backendPort -FrontendPort $frontendPort | Out-Host
          .\start.ps1 -Mock -SkipInstall -BackendPort $backendPort -FrontendPort $frontendPort
          Write-Host 'TERMINAL_PROBE_OK'

          $deadline = (Get-Date).AddSeconds(40)
          $backendReady = $false
          $frontendReady = $false
          while ((Get-Date) -lt $deadline) {
            try {
              $backend = Invoke-WebRequest -Uri "http://127.0.0.1:$backendPort/api/v1/health" -UseBasicParsing -TimeoutSec 2
              $backendReady = ($backend.StatusCode -eq 200)
            } catch { $backendReady = $false }
            try {
              $frontend = Invoke-WebRequest -Uri "http://127.0.0.1:$frontendPort/" -UseBasicParsing -TimeoutSec 2
              $frontendReady = ($frontend.StatusCode -eq 200)
            } catch { $frontendReady = $false }
            if ($backendReady -and $frontendReady) { break }
            Start-Sleep -Milliseconds 500
          }

          .\status.ps1 -BackendPort $backendPort -FrontendPort $frontendPort | Out-Host
          if (-not ($backendReady -and $frontendReady)) {
            foreach ($path in @(
              '.runtime\startup.out.log',
              '.runtime\startup.err.log',
              '.runtime\backend.out.log',
              '.runtime\backend.err.log',
              '.runtime\frontend.out.log',
              '.runtime\frontend.err.log'
            )) {
              Write-Host "--- $path ---"
              Get-Content -LiteralPath $path -Tail 200 -ErrorAction SilentlyContinue | Out-Host
            }
            throw 'Windows background startup did not become healthy.'
          }

          .\stop.ps1 -Force -BackendPort $backendPort -FrontendPort $frontendPort | Out-Host
          Start-Sleep -Seconds 1
          if (@(Get-NetTCPConnection -LocalPort $backendPort -State Listen -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'Backend port was not released.'
          }
          if (@(Get-NetTCPConnection -LocalPort $frontendPort -State Listen -ErrorAction SilentlyContinue).Count -gt 0) {
            throw 'Frontend port was not released.'
          }
      - name: Cleanup
        if: always()
        shell: powershell
        run: .\stop.ps1 -Force -BackendPort 18000 -FrontendPort 15173
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-startup-diagnostics
          path: .runtime
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
