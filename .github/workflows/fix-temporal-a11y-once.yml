name: Fix temporal table accessibility once

on:
  push:
    branches: [agent/mobile-ui-deterministic-chat]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ui-deterministic-chat
          fetch-depth: 0
      - name: Make horizontal professional table keyboard focusable
        shell: python
        run: |
          from pathlib import Path

          path = Path('frontend/src/pages/TemporalPage.vue')
          text = path.read_text(encoding='utf-8')
          before = '<div class="professional-scroll">'
          after = '<div class="professional-scroll" tabindex="0" aria-label="流年大运与原局四柱横向表格">'
          if after in text:
              raise SystemExit(0)
          if text.count(before) != 1:
              raise SystemExit('professional scroll anchor not found exactly once')
          path.write_text(text.replace(before, after), encoding='utf-8')
      - name: Commit business file only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/pages/TemporalPage.vue
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'fix: make temporal professional table keyboard accessible'
          git push origin HEAD:agent/mobile-ui-deterministic-chat
