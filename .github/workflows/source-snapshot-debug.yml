name: Apply temporal audit patch

on:
  push:
    branches: [agent/mobile-ui-deterministic-chat]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'feat: correct exact temporal and shensha calculations'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mobile-ui-deterministic-chat
          fetch-depth: 0
      - name: Reassemble and apply audited patch
        shell: bash
        run: |
          cat .github/temporal_patch/chunk_* | base64 -d | gzip -d > /tmp/temporal.patch
          git apply --check /tmp/temporal.patch
          git apply /tmp/temporal.patch
          rm -rf .github/temporal_patch
          rm -f .github/workflows/source-snapshot-debug.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: correct exact temporal and shensha calculations"
          git push origin HEAD:agent/mobile-ui-deterministic-chat
