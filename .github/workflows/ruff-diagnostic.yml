name: Ruff diagnostic

on:
  push:
    branches: [agent/mobile-ui-deterministic-chat]

jobs:
  ruff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Capture Ruff diagnostics
        id: ruff
        working-directory: backend
        shell: bash
        run: |
          set +e
          python -m ruff check app tests > ruff.log 2>&1
          status=$?
          cat ruff.log
          exit $status
      - name: Upload Ruff diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics
          path: backend/ruff.log
          if-no-files-found: error
          retention-days: 1
